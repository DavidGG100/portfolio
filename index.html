<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>David Gadelkarim: Game Designer</title>
  <meta name="description" content="Portfolio of David Gadelkarim: Game Designer and Developer based in London." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #120f17;
      --bg-glow: #3a1f3f;
      --bg-glow-soft: #28172c;

      --surface: #1d1723;
      --surface-soft: #15111a;
      --surface-strong: #2b2032;
      --surface-hover: #35243a;
      --surface-skip: #fff1e8;

      --text: #fff2ea;
      --text-inverse: #120f17;
      --muted: #d8bdc8;
      --muted-strong: #f0d5c7;

      --accent: #ff8a70;
      --accent-strong: #ffc46b;
      --accent-soft: #4a2a3f;

      --border: #5a3a5f;
      --border-soft: #3a2a40;
      --border-strong: #ff8a70;

      --shadow-soft: rgba(0, 0, 0, 0.36);
      --shadow-deep: rgba(0, 0, 0, 0.48);
      --shadow-glow: rgba(255, 138, 112, 0.22);
      --shadow-glow-strong: rgba(255, 196, 107, 0.32);

      --transparent: transparent;
      --radius: 18px;
      --radius-large: 28px;
      --selector-size: min(84vmin, 680px);
      --selector-size-mobile: min(88vmin, 560px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background:
        radial-gradient(1200px 600px at 50% -20%, var(--bg-glow) 0%, var(--bg-glow-soft) 38%, var(--bg) 70%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .stage {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 3vw, 2rem);
    }

    .selector {
      width: var(--selector-size);
      aspect-ratio: 1 / 1;
      position: relative;
      display: grid;
      place-items: center;
      opacity: 0;
      animation: fade-in .7s ease forwards;
    }

    @keyframes fade-in {
      to {
        opacity: 1;
      }
    }

    .section-link {
      width: 100%;
      height: 100%;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-large);
      padding: 0;
      margin: 0;
      overflow: hidden;
      cursor: pointer;
      background: linear-gradient(180deg, var(--surface-strong), var(--surface));
      box-shadow:
        0 22px 60px var(--shadow-deep),
        0 0 34px var(--shadow-glow);
      transition: transform .28s ease, border-color .28s ease, box-shadow .28s ease, opacity .2s ease;
    }

    .section-link:hover,
    .section-link:focus-visible {
      transform: scale(1.018);
      border-color: var(--border-strong);
      box-shadow:
        0 26px 70px var(--shadow-deep),
        0 0 42px var(--shadow-glow-strong);
      outline: none;
    }

    .section-link:active {
      transform: scale(.992);
    }

    .section-link.is-changing {
      opacity: 0;
      transform: scale(.985);
    }

    .section-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      background: var(--surface-soft);
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: clamp(3rem, 7vw, 4.8rem);
      height: clamp(3rem, 7vw, 4.8rem);
      border-radius: 999px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 76%, var(--transparent));
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      line-height: 1;
      z-index: 2;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 14px var(--shadow-glow);
      transition: transform .24s ease, border-color .24s ease, box-shadow .24s ease, background .24s ease, color .24s ease;
    }

    .arrow:hover,
    .arrow:focus-visible {
      border-color: var(--border-strong);
      box-shadow: 0 0 24px var(--shadow-glow-strong);
      background: color-mix(in srgb, var(--surface-hover) 86%, var(--transparent));
      color: var(--accent-strong);
      outline: none;
    }

    .arrow:active {
      transform: translateY(-50%) scale(.95);
    }

    .arrow-left {
      left: calc(-1 * clamp(4rem, 9vw, 9rem));
    }

    .arrow-right {
      right: calc(-1 * clamp(4rem, 9vw, 9rem));
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 720px) {
      .selector {
        width: var(--selector-size-mobile);
      }

      .arrow {
        background: color-mix(in srgb, var(--surface-soft) 62%, var(--transparent));
      }

      .arrow-left {
        left: .75rem;
      }

      .arrow-right {
        right: .75rem;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Portfolio section selector">
    <div class="selector">
      <button class="arrow arrow-left" type="button" id="previous" aria-label="Previous section">‹</button>

      <button class="section-link" type="button" id="section-link" aria-label="Open Games section">
        <img id="section-image" src="images/image1.jpg" alt="Games section" decoding="async">
      </button>

      <button class="arrow arrow-right" type="button" id="next" aria-label="Next section">›</button>
      <span class="sr-only" id="section-status" aria-live="polite">Games section selected</span>
    </div>
  </main>

  <script>
    const sections = [
      {
        name: "Games",
        image: "images/MainGames.jpg",
        url: "games.html"
      },
      {
        name: "Writing",
        image: "images/MainWriting.jpg",
        url: "writing.html"
      },
      {
        name: "About Me",
        image: "images/MainAbout.jpg",
        url: "about.html"
      }
    ];

    const sectionLink = document.getElementById("section-link");
    const sectionImage = document.getElementById("section-image");
    const sectionStatus = document.getElementById("section-status");
    const previousButton = document.getElementById("previous");
    const nextButton = document.getElementById("next");

    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    function getWrappedIndex(index) {
      return (index + sections.length) % sections.length;
    }

    function renderSection() {
      const section = sections[currentIndex];

      sectionLink.classList.add("is-changing");

      window.setTimeout(() => {
        sectionImage.src = section.image;
        sectionImage.alt = `${section.name} section`;
        sectionLink.setAttribute("aria-label", `Open ${section.name} section`);
        sectionStatus.textContent = `${section.name} section selected`;
        sectionLink.classList.remove("is-changing");
      }, 140);
    }

    function goToSection(direction) {
      currentIndex = getWrappedIndex(currentIndex + direction);
      renderSection();
    }

    function openCurrentSection() {
      window.location.href = sections[currentIndex].url;
    }

    previousButton.addEventListener("click", () => goToSection(-1));
    nextButton.addEventListener("click", () => goToSection(1));
    sectionLink.addEventListener("click", openCurrentSection);

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      const activeTag = document.activeElement?.tagName?.toLowerCase();

      if (activeTag === "input" || activeTag === "textarea" || activeTag === "select") return;

      if (key === "arrowleft" || key === "a") goToSection(-1);
      if (key === "arrowright" || key === "d") goToSection(1);
      if (key === "enter") openCurrentSection();
    });

    sectionLink.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].screenX;
    }, { passive: true });

    sectionLink.addEventListener("touchend", (event) => {
      touchEndX = event.changedTouches[0].screenX;
      const swipeDistance = touchEndX - touchStartX;

      if (Math.abs(swipeDistance) < 50) return;
      if (swipeDistance > 0) goToSection(-1);
      if (swipeDistance < 0) goToSection(1);
    }, { passive: true });

    renderSection();
  </script>
</body>
</html>
