<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>David Gadelkarim: About Me</title>

  <meta
    name="description"
    content="A panel-based About Me presentation for game designer David Gadelkarim."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #120f17;
      --bg-glow: #3a1f3f;
      --bg-glow-soft: #28172c;

      --surface: #1d1723;
      --surface-soft: #15111a;
      --surface-strong: #2b2032;
      --surface-hover: #35243a;
      --surface-skip: #fff1e8;

      --text: #fff2ea;
      --text-inverse: #120f17;
      --muted: #d8bdc8;
      --muted-strong: #f0d5c7;

      --accent: #ff8a70;
      --accent-strong: #ffc46b;
      --accent-soft: #4a2a3f;

      --border: #5a3a5f;
      --border-soft: #3a2a40;
      --border-strong: #ff8a70;

      --shadow-soft: rgba(0, 0, 0, 0.36);
      --shadow-deep: rgba(0, 0, 0, 0.48);
      --shadow-glow: rgba(255, 138, 112, 0.22);
      --shadow-glow-strong: rgba(255, 196, 107, 0.32);

      --transparent: transparent;

      --radius: 18px;
      --maxw: 1200px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        "Helvetica Neue",
        Arial,
        "Noto Sans",
        sans-serif;

      background:
        radial-gradient(
          1200px 600px at 50% -20%,
          var(--bg-glow) 0%,
          var(--bg-glow-soft) 38%,
          var(--bg) 70%
        );

      color: var(--text);
      line-height: 1.5;
    }

    a {
      color: var(--text);
      text-underline-offset: 2px;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .wrap {
      width: min(94vw, var(--maxw));
      margin: 0 auto;
    }

    .skip {
      position: absolute;
      left: -999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .skip:focus {
      left: 1rem;
      top: 1rem;
      width: auto;
      height: auto;
      background: var(--surface-skip);
      color: var(--text-inverse);
      padding: .5rem .75rem;
      border-radius: .5rem;
      z-index: 99;
    }

    header {
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);

      background:
        color-mix(
          in srgb,
          var(--bg) 84%,
          var(--transparent)
        );

      z-index: 40;
      border-bottom: 1px solid var(--border-soft);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .9rem 0;
    }

    .brand {
      font-weight: 800;
      letter-spacing: .2px;
      text-decoration: none;
    }

    .links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .links a {
      text-decoration: none;
      opacity: .86;
      transition:
        color .2s ease,
        opacity .2s ease;
    }

    .links a:hover,
    .links a[aria-current="page"] {
      opacity: 1;
      color: var(--accent-strong);
    }

    main {
      min-height: calc(100vh - 64px);
      display: grid;
      align-items: center;
      padding: 1.5rem 0 2rem;
    }

    .presentation-shell {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 1rem;
    }

    .arrow {
      width: 3rem;
      height: 3rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1.65rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 0 14px var(--shadow-glow);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease,
        border-color .2s ease;
    }

    .arrow:hover,
    .arrow:focus-visible {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      box-shadow: 0 0 24px var(--shadow-glow-strong);
      transform: translateY(-1px);
      outline: none;
    }

    .slide {
      min-height: min(78vh, 760px);

      background:
        linear-gradient(
          180deg,
          var(--surface-strong),
          var(--surface)
        );

      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 8px);

      padding:
        clamp(
          1.15rem,
          2.4vw,
          2rem
        );

      box-shadow:
        0 22px 60px var(--shadow-deep),
        0 0 34px var(--shadow-glow);

      display: grid;
      grid-template-rows: auto 1fr;
      gap: 1rem;
      overflow: hidden;
    }

    .slide-header {
      border-bottom: 1px solid var(--border-soft);
      padding-bottom: .85rem;
    }

    .slide-topline {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 1rem;
      margin-bottom: .55rem;
    }

    .section-label,
    .counter {
      margin: 0;
      color: var(--accent-strong);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .05em;

      font-size:
        clamp(
          .85rem,
          1.1vw,
          1rem
        );

      line-height: 1.2;
    }

    .counter {
      white-space: nowrap;
    }

    h1 {
      font-size:
        clamp(
          2rem,
          4.2vw,
          4.9rem
        );

      line-height: .98;
      margin: 0;
      text-wrap: balance;
    }

    .slide-body {
      display: grid;
      grid-template-columns:
        minmax(0, 1.08fr)
        minmax(260px, .92fr);

      gap: 1rem;
      min-height: 0;
      align-items: stretch;
    }

    .slide-body.text-only {
      grid-template-columns: 1fr;
    }

    .text-panel,
    .image-panel,
    .contact-panel {
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);

      box-shadow:
        inset 0 0 0 1px
        color-mix(
          in srgb,
          var(--text) 3%,
          var(--transparent)
        );

      min-height: 0;
    }

    .text-panel,
    .contact-panel {
      padding:
        clamp(
          1rem,
          2.2vw,
          2rem
        );

      display: grid;
      align-content: center;
      gap: 1rem;
    }

    .image-panel {
      display: grid;
      place-items: center;
      padding: .8rem;
      overflow: hidden;
    }

    .image-panel img {
      width: 100%;
      height: 100%;
      max-height: 520px;
      object-fit: contain;
      border-radius: calc(var(--radius) - 7px);
      background: var(--surface-soft);
    }

    .body-text {
      margin: 0;
      color: var(--text);

      font-size:
        clamp(
          1.05rem,
          1.65vw,
          1.55rem
        );

      line-height: 1.42;
      max-width: 72ch;
    }

    .body-text.small {
      font-size:
        clamp(
          .98rem,
          1.25vw,
          1.18rem
        );

      line-height: 1.55;
    }

    .body-list {
      margin: 0;
      padding-left: 1.2rem;
      color: var(--text);

      font-size:
        clamp(
          1rem,
          1.45vw,
          1.32rem
        );

      line-height: 1.5;
      display: grid;
      gap: .85rem;
    }

    .highlight {
      color: var(--muted-strong);
      font-weight: 800;
    }

    .mobile-controls {
      display: none;
      gap: .8rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .progress-track {
      grid-column: 1 / -1;
      width: 100%;
      height: .45rem;
      background: var(--accent-soft);
      border-radius: 999px;

      box-shadow:
        inset 0 0 0 1px
        color-mix(
          in srgb,
          var(--text) 4%,
          var(--transparent)
        );

      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--accent),
          var(--accent-strong)
        );

      border-radius: inherit;
      transition: width .28s ease;
    }

    @media (max-width: 900px) {
      main {
        align-items: start;
      }

      .presentation-shell {
        grid-template-columns: 1fr;
      }

      .desktop-arrow {
        display: none;
      }

      .mobile-controls {
        display: flex;
      }

      .slide {
        min-height: auto;
        overflow: visible;
      }

      .slide-body {
        grid-template-columns: 1fr;
      }

      .image-panel img {
        max-height: 320px;
      }
    }

    @media (max-width: 620px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
      }

      .links {
        justify-content: flex-start;
      }

      .slide-topline {
        flex-direction: column;
      }

      h1 {
        font-size:
          clamp(
            1.75rem,
            12vw,
            3.25rem
          );
      }

      .arrow {
        width: 2.75rem;
        height: 2.75rem;
      }
    }
  </style>
</head>

<body>
  <a class="skip" href="#main">
    Skip to content
  </a>

  <header>
    <div
      class="wrap nav"
      role="navigation"
      aria-label="Primary"
    >
      <a class="brand" href="index.html">
        David Gadelkarim: Game Designer
      </a>

      <nav
        class="links"
        aria-label="Sections"
      >
        <a href="games.html">
          Games
        </a>

        <a href="writing.html">
          Writing
        </a>

        <a
          href="about.html"
          aria-current="page"
        >
          About Me
        </a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    <section
      class="presentation-shell"
      aria-label="About Me presentation carousel"
    >
      <button
        class="arrow desktop-arrow"
        type="button"
        id="previousSlide"
        aria-label="Previous slide"
      >
        ‹
      </button>

      <article
        class="slide"
        aria-live="polite"
      >
        <div class="slide-header">
          <div class="slide-topline">
            <p
              class="section-label"
              id="slideLabel"
            ></p>

            <div
              class="counter"
              id="slideCounter"
            ></div>
          </div>

          <h1 id="slideTitle"></h1>
        </div>

        <div
          class="slide-body"
          id="slideBody"
        ></div>

        <div
          class="mobile-controls"
          aria-label="Mobile presentation controls"
        >
          <button
            class="arrow"
            type="button"
            id="previousSlideMobile"
            aria-label="Previous slide"
          >
            ‹
          </button>

          <button
            class="arrow"
            type="button"
            id="nextSlideMobile"
            aria-label="Next slide"
          >
            ›
          </button>
        </div>
      </article>

      <button
        class="arrow desktop-arrow"
        type="button"
        id="nextSlide"
        aria-label="Next slide"
      >
        ›
      </button>

      <div
        class="progress-track"
        aria-hidden="true"
      >
        <div
          class="progress-bar"
          id="progressBar"
        ></div>
      </div>
    </section>
  </main>

  <script>
    const slides = [
      {
        label: "About Me",
        title: "David Gadelkarim",
        body: [
          "Game Designer based in London, born in Alexandria, Egypt.",
          "This little presentation covers my upbringing, creative roots, love of games, hobbies, and favourite games."
        ],
        image: "images/PortraitOfMe.jpg",
        imageAlt: "Portrait of David Gadelkarim"
      },
      {
        label: "Upbringing",
        title: "A Third-Culture Background",
        body: [
          "A lot of my life has been defined by an amalgamation of cultural influence: being born in Egypt, living most of my formative life in Kuwait, spending my school years in an American school, acquiring a Hungarian passport, and going to college in the UK.",
          "I sometimes feel separated from my culture of origin, but I also believe this upbringing made me more worldly, understanding, and empathetic."
        ]
      },
      {
        label: "Creative Roots",
        title: "Arts, Science, and Uncertainty",
        body: [
          "I have always been attached to the arts, supplemented by a fascination with experimental and theoretical sciences, especially physics.",
          "For a long time, I thought I would become a musician, while another part of me wanted to pursue computer science or theoretical physics."
        ]
      },
      {
        label: "The Click",
        title: "Chrono Trigger Changed Everything",
        body: [
          "After playing Chrono Trigger for the first time in my last year of high school, something clicked.",
          "Games became the dream consolidation between arts and sciences that I had always wanted to pursue, and I have now dedicated my life to the medium."
        ]
      },
      {
        label: "Games",
        title: "Why I Love This Medium",
        body: [
          "I earnestly believe games to be the premier form of artistic expression, both for the creator and the audience.",
          "There is no artistic medium more malleable, or capable of such a grand variety of innovation and creativity."
        ]
      },
      {
        label: "Interactivity",
        title: "Everyone Plays Differently",
        body: [
          "Because interactivity is so personal, everyone engages with games differently and wants different things from them.",
          "Games can offer social connection, competition, narrative, skill expression, relaxation, achievement, self-expression, curiosity, autonomy, cultural expression, nostalgia, and so much more."
        ]
      },
      {
        label: "Design Philosophy",
        title: "Creating Personal Experiences",
        body: [
          "Game Designers have the profound role of creating deeply personal and intimate experiences for audiences.",
          "That is the core of what makes games beautiful, and why I love creating and experiencing art within this vast medium."
        ]
      },
      {
        label: "Hobbies & Passions",
        title: "Playing, Studying, and Sharing Games",
        list: [
          "Favourite genres: narrative, puzzle, platforming, action, turn-based RPGs, and detective/information games.",
          "Special love for experimental games that approach the medium in unusual ways.",
          "Deep interest in game jams, playing other entries, giving feedback, and speaking with other participants.",
          "Fondness for exhibitions, especially university exhibitions where student creativity is on display."
        ]
      },
      {
        label: "Music",
        title: "A Life of Instruments",
        list: [
          "I have played musical instruments since I was 7 years old.",
          "I can proficiently play piano, drums, guitar, bass, trumpet, and French horn.",
          "I have played French horn as a guest with a travelling orchestra in Kuwait, performed in orchestra pits for local musicals, led a jazz combo, recorded in studios, and performed privately for members of the Kuwaiti government."
        ]
      },
      {
        label: "Writing & Curiosities",
        title: "Stories, Analysis, and Everything Else",
        list: [
          "I love writing in all forms, whether analysis or short stories.",
          "A high-school English teacher heavily inspired and encouraged my writing.",
          "Lightning round: manga, jazz, longform podcasts, math and logic puzzles, sitcoms, theoretical physics videos, tabletop RPGs, indie devlogs, professional wrestling, cultural foods, and travel."
        ]
      },
      {
        label: "Favourite Games",
        title: "Top 50-ish",
        body: [
          "By 50 I of course mean 49, because 50 is not a perfect square and therefore not conducive to a collage in this manner."
        ],
        image: "images/image23.png",
        imageAlt: "Collage of David Gadelkarim's favourite games"
      },
      {
        label: "Contact",
        title: "Reach Out Anytime",
        contact: [
          "davidazmy02@gmail.com"
        ]
      }
    ];

    let currentIndex = 0;

    const labelEl =
      document.getElementById("slideLabel");

    const titleEl =
      document.getElementById("slideTitle");

    const counterEl =
      document.getElementById("slideCounter");

    const bodyEl =
      document.getElementById("slideBody");

    const progressEl =
      document.getElementById("progressBar");

    function renderSlide(index) {
      const slide = slides[index];

      labelEl.textContent =
        slide.label;

      titleEl.textContent =
        slide.title;

      counterEl.textContent =
        `${index + 1} / ${slides.length}`;

      progressEl.style.width =
        `${((index + 1) / slides.length) * 100}%`;

      const textMarkup = slide.list
        ? `
          <div class="text-panel">
            <ul class="body-list">
              ${slide.list
                .map(
                  item => `<li>${item}</li>`
                )
                .join("")}
            </ul>
          </div>
        `
        : slide.contact
          ? `
            <div class="contact-panel">
              ${slide.contact
                .map(
                  item =>
                    `<p class="body-text">${item}</p>`
                )
                .join("")}
            </div>
          `
          : `
            <div class="text-panel">
              ${slide.body
                .map(
                  (item, bodyIndex) =>
                    `
                      <p class="body-text ${
                        bodyIndex > 0
                          ? "small"
                          : ""
                      }">
                        ${item}
                      </p>
                    `
                )
                .join("")}
            </div>
          `;

      const imageMarkup = slide.image
        ? `
          <div class="image-panel">
            <img
              src="${slide.image}"
              alt="${slide.imageAlt}"
              loading="eager"
            >
          </div>
        `
        : "";

      bodyEl.className =
        slide.image
          ? "slide-body"
          : "slide-body text-only";

      bodyEl.innerHTML =
        `${textMarkup}${imageMarkup}`;
    }

    function goToSlide(direction) {
      currentIndex =
        (
          currentIndex +
          direction +
          slides.length
        ) % slides.length;

      renderSlide(currentIndex);
    }

    document
      .getElementById("previousSlide")
      .addEventListener(
        "click",
        () => goToSlide(-1)
      );

    document
      .getElementById("nextSlide")
      .addEventListener(
        "click",
        () => goToSlide(1)
      );

    document
      .getElementById("previousSlideMobile")
      .addEventListener(
        "click",
        () => goToSlide(-1)
      );

    document
      .getElementById("nextSlideMobile")
      .addEventListener(
        "click",
        () => goToSlide(1)
      );

    document.addEventListener(
      "keydown",
      event => {
        const key =
          event.key.toLowerCase();

        const activeTag =
          document.activeElement
            ?.tagName
            ?.toLowerCase();

        if (
          activeTag === "input" ||
          activeTag === "textarea" ||
          activeTag === "select"
        ) {
          return;
        }

        if (
          key === "arrowleft" ||
          key === "a"
        ) {
          event.preventDefault();
          goToSlide(-1);
        }

        if (
          key === "arrowright" ||
          key === "d"
        ) {
          event.preventDefault();
          goToSlide(1);
        }
      }
    );

    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener(
      "touchstart",
      event => {
        touchStartX =
          event.changedTouches[0].screenX;
      }
    );

    document.addEventListener(
      "touchend",
      event => {
        touchEndX =
          event.changedTouches[0].screenX;

        const swipeDistance =
          touchEndX - touchStartX;

        if (
          Math.abs(swipeDistance) < 50
        ) {
          return;
        }

        if (swipeDistance > 0) {
          goToSlide(-1);
        }

        if (swipeDistance < 0) {
          goToSlide(1);
        }
      }
    );

    renderSlide(currentIndex);
  </script>
</body>
</html>
