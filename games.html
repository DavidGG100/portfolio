<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>David Gadelkarim's Games Portfolio</title>
  <meta name="description" content="A focused one-game-at-a-time carousel portfolio of game designer David Gadelkarim's projects." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Core palette: warm plum, cream, coral, and soft gold. */
      --bg: #120f17;
      --bg-glow: #3a1f3f;
      --bg-glow-soft: #28172c;

      --surface: #1d1723;
      --surface-soft: #15111a;
      --surface-strong: #2b2032;
      --surface-hover: #35243a;
      --surface-skip: #fff1e8;

      --text: #fff2ea;
      --text-inverse: #120f17;
      --muted: #fff2ea;
      --muted-strong: #f0d5c7;

      --accent: #ff8a70;
      --accent-strong: #ffc46b;
      --accent-soft: #4a2a3f;

      --border: #5a3a5f;
      --border-soft: #3a2a40;
      --border-strong: #ff8a70;

      --shadow-soft: rgba(0, 0, 0, 0.36);
      --shadow-deep: rgba(0, 0, 0, 0.48);
      --shadow-glow: rgba(255, 138, 112, 0.22);
      --shadow-glow-strong: rgba(255, 196, 107, 0.32);

      --transparent: transparent;
      --radius: 18px;
      --maxw: 1200px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -20%, var(--bg-glow) 0%, var(--bg-glow-soft) 38%, var(--bg) 70%);
      color: var(--text);
      line-height: 1.5;
    }

    a {
      color: var(--text);
      text-underline-offset: 2px;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .wrap {
      width: min(94vw, var(--maxw));
      margin: 0 auto;
    }

    .skip {
      position: absolute;
      left: -999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .skip:focus {
      left: 1rem;
      top: 1rem;
      width: auto;
      height: auto;
      background: var(--surface-skip);
      color: var(--text-inverse);
      padding: .5rem .75rem;
      border-radius: .5rem;
      z-index: 99;
    }

    header {
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);
      background: color-mix(in srgb, var(--bg) 84%, var(--transparent));
      z-index: 40;
      border-bottom: 1px solid var(--border-soft);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .9rem 0;
    }

    .brand {
      font-weight: 800;
      letter-spacing: .2px;
      text-decoration: none;
    }

    .links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .links a {
      text-decoration: none;
      opacity: .86;
      transition: color .2s ease, opacity .2s ease;
    }

    .links a:hover,
    .links a[aria-current="page"] {
      opacity: 1;
      color: var(--accent-strong);
    }

    main {
      min-height: calc(100vh - 64px);
      display: grid;
      align-items: center;
      padding: 1.5rem 0 2rem;
    }

    .carousel-shell {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 1rem;
    }

    .arrow {
      width: 3rem;
      height: 3rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1.65rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 0 14px var(--shadow-glow);
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
    }

    .arrow:hover,
    .arrow:focus-visible {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      box-shadow: 0 0 24px var(--shadow-glow-strong);
      transform: translateY(-1px);
      outline: none;
    }

    .showcase {
      min-height: min(78vh, 760px);
      background: linear-gradient(180deg, var(--surface-strong), var(--surface));
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 8px);
      padding: clamp(1rem, 2vw, 1.6rem);
      box-shadow:
        0 22px 60px var(--shadow-deep),
        0 0 34px var(--shadow-glow);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 1rem;
      overflow: hidden;
    }

    .showcase-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid var(--border-soft);
      padding-bottom: .8rem;
    }

    h1 {
      font-size: clamp(1.55rem, 2.7vw, 2.8rem);
      line-height: 1.08;
      margin: 0;
    }

    .counter {
      color: var(--accent-strong);
      font-weight: 800;
      white-space: nowrap;
      padding-top: .2rem;
    }

    .media-grid {
      display: grid;
      grid-template-columns: minmax(220px, .88fr) minmax(320px, 1.12fr);
      gap: 1rem;
      min-height: 0;
      align-items: stretch;
    }

    .panel {
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      overflow: hidden;
      min-height: 0;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 3%, var(--transparent));
    }

    .cover-panel,
    .video-panel {
      display: grid;
      place-items: center;
      padding: .7rem;
    }

    .cover-panel img {
      width: 100%;
      height: 100%;
      max-height: 430px;
      object-fit: contain;
      border-radius: calc(var(--radius) - 7px);
      background: var(--surface-soft);
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: calc(var(--radius) - 7px);
      background: var(--surface-soft);
    }

    .writeup {
      margin: 0;
      color: var(--muted);
      font-size: clamp(.98rem, 1.2vw, 1.08rem);
      max-width: 90ch;
    }

    .controls-note {
      color: var(--muted);
      font-size: .88rem;
      margin-top: .6rem;
    }

    .mobile-controls {
      display: none;
      gap: .8rem;
      justify-content: center;
      margin-top: 1rem;
    }

    @media (max-width: 900px) {
      main {
        align-items: start;
      }

      .carousel-shell {
        grid-template-columns: 1fr;
      }

      .desktop-arrow {
        display: none;
      }

      .mobile-controls {
        display: flex;
      }

      .showcase {
        min-height: auto;
        overflow: visible;
      }

      .media-grid {
        grid-template-columns: 1fr;
      }

      .cover-panel img {
        max-height: 280px;
      }

      .showcase-header {
        align-items: start;
      }
    }

    @media (max-width: 620px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
      }

      .links {
        justify-content: flex-start;
      }

      .showcase-header {
        flex-direction: column;
      }

      .counter {
        padding-top: 0;
      }

      .arrow {
        width: 2.75rem;
        height: 2.75rem;
      }
    }
  </style>
</head>

<body>
  <a class="skip" href="#main">Skip to content</a>

  <header>
    <div class="wrap nav" role="navigation" aria-label="Primary">
      <a class="brand" href="index.html">David Gadelkarim: Game Designer</a>
      <nav class="links" aria-label="Sections">
        <a href="games.html" aria-current="page">Games</a>
        <a href="writing.html">Writing</a>
        <a href="about.html">About Me</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    <section class="carousel-shell" aria-label="Games portfolio carousel">
      <button class="arrow desktop-arrow" type="button" id="previousGame" aria-label="Previous game">‹</button>

      <article class="showcase" aria-live="polite">
        <div class="showcase-header">
          <h1 id="gameTitle"></h1>
          <div class="counter" id="gameCounter"></div>
        </div>

        <div class="media-grid">
          <div class="panel cover-panel">
            <img id="gameCover" src="" alt="" loading="eager">
          </div>

          <div class="panel video-panel">
            <iframe
              id="gameVideo"
              class="video-frame"
              title="Game video"
              src=""
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen>
            </iframe>
          </div>
        </div>

        <div>
          <p class="writeup" id="gameWriteup"></p>
          <div class="controls-note"></div>
          <div class="mobile-controls" aria-label="Mobile carousel controls">
            <button class="arrow" type="button" id="previousGameMobile" aria-label="Previous game">‹</button>
            <button class="arrow" type="button" id="nextGameMobile" aria-label="Next game">›</button>
          </div>
        </div>
      </article>

      <button class="arrow desktop-arrow" type="button" id="nextGame" aria-label="Next game">›</button>
    </section>
  </main>

  <script>
    const games = [
  {
    "title": "The Red Rain Case (In Development)",
    "cover": "images/image18.png",
    "video": "https://youtu.be/maFZJLIZqCs",
    "writeup": "In The Red Rain Case, players control a cosmic entity that exists as a divine anthropomorphisation of Truth itself. This entity takes the shape of a Detective who has full dominion over the flow of time. Whenever the fog of mistruth reaches a breaking point, the gears of time shatter, Red Rain falls from the sky, and this Detective appears, with a single-minded determination to find the truth. Due to the Detective’s existence as Truth personified, they are unable to discern between human shapes, voices, and smell, to be as objective as possible. Instead, they derive the truth by taking individual beings out of the…"
  },
  {
    "title": "Soup for The Consumer",
    "cover": "images/image2.png",
    "video": "https://youtu.be/z1CxK9jxZ8Q",
    "writeup": "Soup for The Consumer is my 3rd term MA Games Design practical project, it’s a surreal and absurd cooking game, where players are tasked to cook emotions using rational objects. There are no right or wrong answers, the game exists entirely as a canvas for self-expression, and an exploration of the meaning and value of objects and symbols. This game was chosen to be on display at MCM London Comic Con's EGX Leftfield Collection."
  },
  {
    "title": "Cloud Posting",
    "cover": "images/image17.png",
    "video": "https://youtu.be/RLhgUjcZqL4",
    "writeup": "Cloud Posting is a satire on the role of social media in the deterioration of human interaction, masquerading as a relaxing sky writing game! It was made in just 4 days for the GMTK Jam with the theme of “loop”, and contains quite a complex writing detection system, and a heavily elaborate branching narrative tree based on player performance as well as the missions they choose to accept/deny."
  },
  {
    "title": "An Ordinary Business Lunch",
    "cover": "images/image20.png",
    "video": "https://www.youtube.com/watch?v=icOGyGe-0vQ&t=206s",
    "writeup": "Ranking 19 out of 853 entries in the 2025 Boss Rush Jam, An Ordinary Business Lunch is an innovative and bizarre boss rush game, where players compete in a wits based tug-of-war with a satanic mafia don in a series of business lunches. The theme for the jam was “spin” and we incorporated that by having players do battle with a lazy susan as the battlefield."
  },
  {
    "title": "Back and Forth",
    "cover": "images/image22.jpg",
    "video": "https://youtu.be/YlJu1owMUDA",
    "writeup": "Back and Forth is an anthology project featuring a video game, a physical arcade machine, and an experimental games zine, all of which were exhibited at Now Play This 2025. The theme of the exhibition was folkgames, and we covered that topic by taking the singular concept of “Ping Pong” and iterating on it, pushing to its absolute limits through the different parts of this anthology project."
  },
  {
    "title": "Back and Forth: Cube Pong",
    "cover": "images/image11.jpg",
    "video": "https://youtu.be/0AQQx7HePcs",
    "writeup": "Part of the Back and Forth anthology project exhibited at Now Play This 2025, Cube Pong is a high-octane arcade machine, where players are tasked to do quite mental computation, while physically manipulating a giant dice. It’s a competitive 2 player game, pushing players’ mental and physical aptitudes to their absolute limits."
  },
  {
    "title": "Back and Forth: Beat Pong",
    "cover": "images/image3.png",
    "video": "https://youtu.be/7gdgd_BQejA",
    "writeup": "Part of the Back and Forth anthology project exhibited at Now Play This 2025, Beat Pong combines 4 different game genres into one hectic and visually striking experience: rhythm games, turn-based systems, card-based battlers, and boss rushes."
  },
  {
    "title": "You Are Here.",
    "cover": "images/image4.png",
    "video": "https://youtu.be/NkVan1E9Cas",
    "writeup": "An unconventional piece made for the first unit of my Games Design MA covering the subjectivity of perception, and the reality/unreality of interactive media. These abstract ideas are explored through a platformer featuring 2 characters and 2 controllers, with players controlling a 2D and 3D character simultaneously using both a Dancepad and a Controller respectively."
  },
  {
    "title": "Letter Wars",
    "cover": "images/image13.png",
    "video": "https://youtu.be/ykMgiZ7Taok",
    "writeup": "Letter Wars was my final BA Games Design project. It’s an ambitious 2D Boss Rush featuring over 20 bosses based on the letters of the alphabet, all with very distinct behaviors and movement patterns, solely developed by myself in around 3 months. The game was created to be an homage to the late 2000s-early 2010s era of free brutally difficult online games."
  },
  {
    "title": "RPS Ultra Adventure",
    "cover": "images/image14.png",
    "video": "https://youtu.be/TfSCAOQMqk4",
    "writeup": "An approximately 30 minute long 1-BIT turn based RPG game, created as a homage to the 80-90s retro era of RPGs within a single week for the 1 Bit Game Jam under the theme Light and Darkness. Players explore a world overlayed between a Light and Dark dimension, as they meet with eccentric NPCs and engaging in friendly and deadly games of Rock, Paper, Scissor."
  },
  {
    "title": "Don't Touch THE THNIG",
    "cover": "images/image15.jpg",
    "video": "https://youtu.be/--XJHvj2Vkg",
    "writeup": "A board game I created for my masters course, and my first ever purely physical game design work. It’s a frenetic dexterity based party game, where players flick tokens across the table until one is left standing. However, while doing that, players must be aware of one all too crucial rule: Don’t Touch THE THING."
  },
  {
    "title": "Marble Labyrinth",
    "cover": "images/image16.jpg",
    "video": "https://youtu.be/IazxLHcdurI",
    "writeup": "This project was born out of the task to make a tabletop escape room. In a group of 4, we made a cooperative marble maze with several floors. Players have to work together to solve physical and mental puzzles in order to reach the end of this elaborate and flashy contraption we created."
  },
  {
    "title": "Memories of Closure",
    "cover": "images/image7.png",
    "video": "https://youtu.be/sY7JjeIKbFs",
    "writeup": "An abstract and atmospheric 3D Metroidvania, made for the Metroidvania game jam in a group of 4 across 1 month, where players explore a world constructed of consciousness and memory. It's a highly symbolic and esoteric experience, nothing is as it seems, and everything exists for a purpose. Our goal was to take the metroidvania genre, which has typically been housed in 2D form, and bring it to an esoteric 3D form. We also wanted to mix the genre of Metroidvanias with atmospheric horror, while layering it with a profound absurdity."
  },
  {
    "title": "I Wanna Grow Taller!",
    "cover": "images/image19.jpg",
    "video": "https://youtu.be/0MzLem6nQik",
    "writeup": "A charming endless runner planned and crafted in only 3 hours for the Trijam Game Jam. Due to the massive restriction, this was a very effective excercise in restraint, and an agile scrum approach to design and development. We aimed for a very mechanically simple yet fun gameplay loop, and made all the focus on the presentation which proved to be the correct decision as we won first place in this game jam."
  },
  {
    "title": "ROCKBOTTOM HERO",
    "cover": "images/image6.png",
    "video": "https://youtu.be/6juZCb-4T0Y",
    "writeup": "Rockbottom Hero is a comedic auto-runner made with a grid-based system. This remains the most stressful game I've ever had to make, as it was simply too ambitious for the meager 3 day time limit. Despite that, we were still able to construct the vision we initially had in mind."
  },
  {
    "title": "SLUG HOUSE",
    "cover": "images/image5.png",
    "video": "https://youtu.be/R35iKvDaEt8",
    "writeup": "A 2D side-scroller beat-em-up made in a group of 4 in 2 weeks for the GameDev.js game jam. For this project, our main priority was making a beat-em-up with fantastic game feel, so we researched all the ways in which games of that manner juice their gameplay experience, and we implemented as much of it as possible, with the mechanics and level design coming in secondary to audiovisual experience in that regard. We treated this more as an experiment and learning opportunity, than a jam we rigorously aimed to win."
  },
  {
    "title": "Little Vocab Master!",
    "cover": "images/image24.jpg",
    "video": "https://youtu.be/MKNA8PXvqiI",
    "writeup": "The prompt that we were given was to make a game with the same base mechanics as an app store game named 'Pack Master', but with our own unique spin. The brunt of the task was less to do with developing the game, and more so designing a blueprint and delivering a sales pitch with a target audience in mind. We made our take on this prompt a kid friendly game. Linked is the video I scripted, voiced, and edited, pitching the game."
  },
  {
    "title": "GRAVITY: NULL",
    "cover": "images/image10.png",
    "video": "https://youtu.be/tmEAkPlMgwo",
    "writeup": "My first 3D game, made in collaboration with 2 other people in a brief timespan for a game jam. It was a first person platforming speedrunner with the unique mechanic of stopping gravity. It consists of 7 levels all of which have a time limit of 20 seconds, and steadily introduces new mechanics as the game progresses."
  },
  {
    "title": "Eternal Game Night",
    "cover": "images/image9.png",
    "video": "https://youtu.be/txqmGvpPTUQ",
    "writeup": "Eternal Game Night is an atmospheric puzzle game where the player engages in a simple card game with the devil. Like I Wanna Grow Taller, mentioned previously in this portfolio, this game was planned and made in 3 hours, we went for a completely different approach for this game. Our first 3 hour game was physical, while we made this one a mentally oriented cryptic puzzle game."
  },
  {
    "title": "Return to Your Roots",
    "cover": "images/image8.png",
    "video": "https://youtu.be/SIKIDwaMszU",
    "writeup": "In this Boss Rush game, begin at your strongest, as you control time and fire lasers to trounce the enemy before you, however, as you progress, your strength will drain as you return to your roots against adversaries who take away time itself. As my first ever game jam game, the first game I’ve ever worked on in a solely online environment, and a game made in only 3 days no less, this was never going to be the most ideal work. It’s to the point that my teammate and I constantly make fun of this game, as it is quite weak in retrospect. However…"
  },
  {
    "title": "Renaissance Accademia",
    "cover": "images/image12.jpg",
    "video": "https://youtu.be/VZ0daeik9QM",
    "writeup": "An atmospheric 3 level 2D platformer game made by 5 people. This was a fisrt term 2nd year university assignment and definitely the weakest work in this portfolio, but important to note and reflect on nonetheless, as it's a very imporant formative experence for me as a designer."
  },
  {
    "title": "Castle Protector",
    "cover": "images/image21.png",
    "video": "https://youtu.be/KPYKzzLkPpE",
    "writeup": "Protect your castle from the Shape Army in this mentally strenuating Endless Runner! The only thing that can defeat them are custom made bullets designed to destroy enemies of their same shape. If you shoot an enemy with the wrong shape, the enemy will get stronger and you will lose a life. Made for the University of the Art London’s BA Games Design course in my first year, this is the first game I ever designed and created from scratch, and as a result, it’s certainly rough in several areas, but also an interesting and valuable work to discus because of those limitations and rough…"
  }
];

    let currentIndex = 0;

    const titleEl = document.getElementById('gameTitle');
    const counterEl = document.getElementById('gameCounter');
    const coverEl = document.getElementById('gameCover');
    const videoEl = document.getElementById('gameVideo');
    const writeupEl = document.getElementById('gameWriteup');

    function youtubeEmbedUrl(url) {
      if (!url) return '';

      try {
        const parsed = new URL(url);

        if (parsed.hostname.includes('youtu.be')) {
          return `https://www.youtube.com/embed/${parsed.pathname.replace('/', '')}`;
        }

        if (parsed.hostname.includes('youtube.com')) {
          const videoId = parsed.searchParams.get('v');
          if (videoId) return `https://www.youtube.com/embed/${videoId}`;

          if (parsed.pathname.includes('/embed/')) return url;
          if (parsed.pathname.includes('/shorts/')) return `https://www.youtube.com/embed/${parsed.pathname.split('/shorts/')[1]}`;
        }
      } catch (error) {
        console.warn('Invalid video URL:', url);
      }

      return url;
    }

    function renderGame(index) {
      const game = games[index];

      titleEl.textContent = game.title;
      counterEl.textContent = `${index + 1} / ${games.length}`;
      coverEl.src = game.cover;
      coverEl.alt = `${game.title} cover image`;
      videoEl.src = youtubeEmbedUrl(game.video);
      videoEl.title = `${game.title} video`;
      writeupEl.textContent = game.writeup;
    }

    function goToGame(direction) {
      currentIndex = (currentIndex + direction + games.length) % games.length;
      renderGame(currentIndex);
    }

    document.getElementById('previousGame').addEventListener('click', () => goToGame(-1));
    document.getElementById('nextGame').addEventListener('click', () => goToGame(1));
    document.getElementById('previousGameMobile').addEventListener('click', () => goToGame(-1));
    document.getElementById('nextGameMobile').addEventListener('click', () => goToGame(1));

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      const activeTag = document.activeElement?.tagName?.toLowerCase();

      if (activeTag === 'input' || activeTag === 'textarea' || activeTag === 'select') return;

      if (key === 'arrowleft' || key === 'a') goToGame(-1);
      if (key === 'arrowright' || key === 'd') goToGame(1);
    });

    renderGame(currentIndex);
  </script>
</body>
</html>
