<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>David Gadelkarim's Games Portfolio</title>

  <meta
    name="description"
    content="A focused one-game-at-a-time carousel portfolio of game designer David Gadelkarim's projects."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #120f17;
      --bg-glow: #3a1f3f;
      --bg-glow-soft: #28172c;

      --surface: #1d1723;
      --surface-soft: #15111a;
      --surface-strong: #2b2032;
      --surface-hover: #35243a;
      --surface-skip: #fff1e8;

      --text: #ffffff;
      --text-inverse: #120f17;
      --muted: #d8bdc8;

      --accent: #ff8a70;
      --accent-strong: #ffc46b;
      --accent-soft: #4a2a3f;

      --border: #5a3a5f;
      --border-soft: #3a2a40;
      --border-strong: #ff8a70;

      --shadow-deep: rgba(0, 0, 0, 0.48);
      --shadow-glow: rgba(255, 138, 112, 0.22);
      --shadow-glow-strong: rgba(255, 196, 107, 0.32);

      --transparent: transparent;

      --radius: 18px;
      --maxw: 1200px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        "Helvetica Neue",
        Arial,
        "Noto Sans",
        sans-serif;

      background:
        radial-gradient(
          1200px 600px at 50% -20%,
          var(--bg-glow) 0%,
          var(--bg-glow-soft) 38%,
          var(--bg) 70%
        );

      color: var(--text);
      line-height: 1.5;
    }

    a {
      color: var(--text);
      text-underline-offset: 2px;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .wrap {
      width: min(94vw, var(--maxw));
      margin: 0 auto;
    }

    .skip {
      position: absolute;
      left: -999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .skip:focus {
      left: 1rem;
      top: 1rem;
      width: auto;
      height: auto;
      padding: .5rem .75rem;
      background: var(--surface-skip);
      color: var(--text-inverse);
      border-radius: .5rem;
      z-index: 99;
    }

    header {
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);

      background:
        color-mix(
          in srgb,
          var(--bg) 84%,
          var(--transparent)
        );

      border-bottom: 1px solid var(--border-soft);
      z-index: 40;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .9rem 0;
    }

    .brand {
      font-weight: 800;
      letter-spacing: .2px;
      text-decoration: none;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 1rem;
    }

    .links a {
      text-decoration: none;
      opacity: .86;
      transition: color .2s ease, opacity .2s ease;
    }

    .links a:hover,
    .links a[aria-current="page"] {
      color: var(--accent-strong);
      opacity: 1;
    }

    main {
      min-height: calc(100vh - 64px);
      display: grid;
      align-items: center;
      padding: 1.5rem 0 2rem;
    }

    .carousel-shell {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 1rem;
    }

    .arrow {
      width: 3rem;
      height: 3rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 1.65rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 0 14px var(--shadow-glow);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease,
        border-color .2s ease;
    }

    .arrow:hover,
    .arrow:focus-visible {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      box-shadow: 0 0 24px var(--shadow-glow-strong);
      transform: translateY(-1px);
      outline: none;
    }

    .showcase {
      min-height: min(78vh, 760px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 1rem;
      padding: clamp(1rem, 2vw, 1.6rem);

      background:
        linear-gradient(
          180deg,
          var(--surface-strong),
          var(--surface)
        );

      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 8px);

      box-shadow:
        0 22px 60px var(--shadow-deep),
        0 0 34px var(--shadow-glow);

      overflow: hidden;
      cursor: pointer;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        transform .2s ease;
    }

    .showcase.has-link:hover {
      border-color: var(--border-strong);

      box-shadow:
        0 22px 60px var(--shadow-deep),
        0 0 44px var(--shadow-glow-strong);

      transform: translateY(-2px);
    }

    .showcase:focus-visible {
      outline: 3px solid var(--accent-strong);
      outline-offset: 5px;
    }

    .showcase:not(.has-link) {
      cursor: default;
    }

    .showcase:not(.has-link):hover {
      border-color: var(--border);
      box-shadow:
        0 22px 60px var(--shadow-deep),
        0 0 34px var(--shadow-glow);
      transform: none;
    }

    .showcase-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: .8rem;
      border-bottom: 1px solid var(--border-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 2.7vw, 2.8rem);
      line-height: 1.08;
    }

    .counter {
      padding-top: .2rem;
      color: var(--accent-strong);
      font-weight: 800;
      white-space: nowrap;
    }

    .media-grid {
      display: grid;
      grid-template-columns: minmax(220px, .88fr) minmax(320px, 1.12fr);
      align-items: stretch;
      gap: 1rem;
      min-height: 0;
    }

    .panel {
      min-height: 0;
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);

      box-shadow:
        inset 0 0 0 1px
        color-mix(
          in srgb,
          var(--text) 3%,
          var(--transparent)
        );

      overflow: hidden;
    }

    .cover-panel,
    .video-panel {
      display: grid;
      place-items: center;
      padding: .7rem;
    }

    .cover-panel img {
      width: 100%;
      height: 100%;
      max-height: 430px;
      object-fit: contain;
      background: var(--surface-soft);
      border-radius: calc(var(--radius) - 7px);
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: calc(var(--radius) - 7px);
      background: var(--surface-soft);
    }

    .writeup {
      max-width: 90ch;
      margin: 0;
      color: var(--text);
      font-size: clamp(.98rem, 1.2vw, 1.08rem);
    }

    .mobile-controls {
      display: none;
      justify-content: center;
      gap: .8rem;
      margin-top: 1rem;
    }

    .progress-track {
      grid-column: 1 / -1;
      width: 100%;
      height: .45rem;
      background: var(--accent-soft);
      border-radius: 999px;

      box-shadow:
        inset 0 0 0 1px
        color-mix(
          in srgb,
          var(--text) 4%,
          var(--transparent)
        );

      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--accent),
          var(--accent-strong)
        );

      border-radius: inherit;
      transition: width .28s ease;
    }

    @media (max-width: 900px) {
      main {
        align-items: start;
      }

      .carousel-shell {
        grid-template-columns: 1fr;
      }

      .desktop-arrow {
        display: none;
      }

      .mobile-controls {
        display: flex;
      }

      .showcase {
        min-height: auto;
        overflow: visible;
      }

      .media-grid {
        grid-template-columns: 1fr;
      }

      .cover-panel img {
        max-height: 280px;
      }

      .showcase-header {
        align-items: start;
      }
    }

    @media (max-width: 620px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
      }

      .links {
        justify-content: flex-start;
      }

      .showcase-header {
        flex-direction: column;
      }

      .counter {
        padding-top: 0;
      }

      .arrow {
        width: 2.75rem;
        height: 2.75rem;
      }
    }
  </style>
</head>

<body>
  <a class="skip" href="#main">Skip to content</a>

  <header>
    <div class="wrap nav" role="navigation" aria-label="Primary">
      <a class="brand" href="index.html">
        David Gadelkarim: Game Designer
      </a>

      <nav class="links" aria-label="Sections">
        <a href="games.html" aria-current="page">Games</a>
        <a href="writing.html">Writing</a>
        <a href="about.html">About Me</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    <section
      class="carousel-shell"
      aria-label="Games portfolio carousel"
    >
      <button
        class="arrow desktop-arrow"
        type="button"
        id="previousGame"
        aria-label="Previous game"
      >
        ‹
      </button>

      <article
        class="showcase"
        id="gameShowcase"
        tabindex="0"
        role="link"
        aria-live="polite"
        aria-label="Open current game"
      >
        <div class="showcase-header">
          <h1 id="gameTitle"></h1>
          <div class="counter" id="gameCounter"></div>
        </div>

        <div class="media-grid">
          <div class="panel cover-panel">
            <img
              id="gameCover"
              src=""
              alt=""
              loading="eager"
            >
          </div>

          <div class="panel video-panel">
            <iframe
              id="gameVideo"
              class="video-frame"
              title="Game video"
              src=""
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            ></iframe>
          </div>
        </div>

        <div>
          <p class="writeup" id="gameWriteup"></p>

          <div
            class="mobile-controls"
            aria-label="Mobile carousel controls"
          >
            <button
              class="arrow"
              type="button"
              id="previousGameMobile"
              aria-label="Previous game"
            >
              ‹
            </button>

            <button
              class="arrow"
              type="button"
              id="nextGameMobile"
              aria-label="Next game"
            >
              ›
            </button>
          </div>
        </div>
      </article>

      <button
        class="arrow desktop-arrow"
        type="button"
        id="nextGame"
        aria-label="Next game"
      >
        ›
      </button>

      <div class="progress-track" aria-hidden="true">
        <div
          class="progress-fill"
          id="gameProgress"
        ></div>
      </div>
    </section>
  </main>

  <script>
    const games = [
      {
        title: "Crimson Rain",
        cover: "images/image29.jpg",
        video: "https://youtu.be/6m14KlNicKQ",
        link: "https://megamelone.itch.io/crimon-rain-prototype",
        writeup:
        "Crimson Rain was brought about by an observation regarding the history of stereotyping and motivated reasoning in classic detective literature, and the potential impacts in which those harmful foundations being operationalised in games could result in, which is a topic I will be giving a talk on at British DiGRA 2026. Rather than provide an answer or a solution to this observation, my aim was to experiment with the dynamics of detective gameplay, creating a game where every character is visually indistinguishable and deduction can only be posited through their respective actions. When bias based on appearance and circumstance is omitted, how does the detective game experience change, how do we reach truth if so much of its foundation is omitted, how do we deal with non-objective truth? As players manipulate time with a custom-built alternative controller made for the game, these are the questions I try to guide them into pondering."
      },
      {
        title: "The Sealed Box of Absurdity",
        cover: "images/image37.png",
        video: "https://youtu.be/PRNwYSBidJ0",
        link: "https://megamelone.itch.io/the-sealed-box-of-absurdity",
        writeup:
        "It’s human nature to be curious, as it is to be discomforted by the unknown and the lack of answers. The Sealed Box of Absurdity plays on that nature and discomfort, creating a mystery game with no actual answers, as players explore 1,000 dimensions filled with unexplainable absurdity and nonsense. While attempting to uncover any semblance of rationality within these sealed boxes, they encounter a previous denizen of the box, slowly driving themself to ruin trying to figure out any semblance of truth within it. However, the ultimate thesis of the game is that sometimes things just exist, we just exist, and that’s all the truth there is to it. Whether that’s a comforting reality, or an existential one, it’s one that I believe is important to contend with. Hence, the creation of this frankly wildly ambitious game, and the series of nonsensical oddities within its walls."
      },
      {
        title: "Soup for The Consumer",
        cover: "images/image2.png",
        video: "https://youtu.be/X-63Adw0s2U",
        link: "https://megamelone.itch.io/soup-for-the-consumer",
        writeup:
        "An abstract exploration of what objects, emotions, and the concept of meaning are, Soup for The Consumer tasks players with cooking emotions using inedible objects as ingredients. The game offers no right or wrong answers, merely a canvas for self expression, as players reflect on their relationships with heavy emotions, and a wide variety of seemingly mundane objects. This game stemmed from research on semiotics, mapping out a framework for understanding organic meaning-making in games, by charting the relationship between symbols and context, and the ways in which their respective conventionality and unconventionality shape how meaning is formed. When I place all of these conventional objects, in this entirely unconventional space, what meaning emerges? Everyone responds to this game differently, and takes different things out of it, I hope you can also make your own soup, made from your own truth."
      },
      {
        title: "Cloud Posting",
        cover: "images/image17.png",
        video: "https://youtu.be/RLhgUjcZqL4",
        link: "https://megamelone.itch.io/cloud-posting",
        writeup:
        "Talking to people is really hard, so it’s a good thing that we have the internet to help us make social communication significantly less intimate and personal! Unfortunately, the world of Cloud Posting doesn’t have that same access to impersonal digital communication, so you’re forced to take on that role, being tasked by the denizens of this world to write messages in the sky for everyone to see. With quite the complex writing detection system on the back-end, and a QWOP-esque chaotic control-scheme on the front-end, players will most likely fail these requests, upon which, they will encounter the game’s branching narrative system, where their missions change depending on whether they were successful or not with their requests. This paradoxically ambitious and relaxing game was made in just 3 days for 2025’s GMTK Game Jam."
      },
      {
        title: "An Ordinary Business Lunch",
        cover: "images/image20.png",
        video:
          "https://www.youtube.com/watch?v=icOGyGe-0vQ&t=206s",
        link:
          "https://mayansgames.itch.io/an-ordinary-business-lunch",
        writeup:
        "A classic business lunch is something we frankly all have experience with: the variety of foods, the negotiations, the tepid and tedious pleasantries, the tendency to hurl plates at each other, the green skinned Eldritchian Demon in front of you wearing the skin of a corporate CEO with the ability to extract human souls at a whim, and of course the professionally written emails! An Ordinary Business Lunch is a wholly accurate simulation, of the not at all soul-crushing experience of participating in a business lunch, with absolutely no hyperbole at all to convey the vapidity of the false comradery formed between individuals who care solely about their own profits. It's an innovative boss rush game, where you battle using a lazy susan, spinning it, eating foods, and throwing plates, in a battle of attrition and wits against your all-powerful opponent, who may or may not pull a gun out on you in the process."
      },
      {
        title: "Back and Forth",
        cover: "images/image22.jpg",
        video: "https://youtu.be/YlJu1owMUDA",
        link: "",
        writeup:
        "As an exploration on “Folk Games” and the manner in which play evolves between cultures, communities and contexts, Back and Forth was created as an experimental games anthology, taking the base framework of Ping Pong and seeing just how much it can be pushed before it becomes unrecogniseable, and frankly an entirely different game. It features a digital game, a physical arcade machine, and a zine, all of which have absurd and abstracted interpretations of Ping Pong, and all of which were showcased at Now Play This 2025. We split the core of the game into 4 ideas: back and forth gameplay, the aesthetic components of the game (that being the table, rackets, and ball), the points based system, and the physical movements associated with the game, and looked to deconstruct those elements in different ways and combinations."
      },
      {
        title: "Back and Forth: Cube Pong",
        cover: "images/image11.jpg",
        video: "https://youtu.be/0AQQx7HePcs",
        link: "",
        writeup:
        "Cube Pong is the centerpiece of the larger Back and Forth anthology, a ridiculously high-production fusion of arcade and board game design centred around arithmetic, spatial reasoning, and the basic pleasure of making another person panic. Players race to move a giant die across a grid of numbered tiles, matching an on-screen value using the die and the tile beneath it, while their opponent hammers through a sequence of buttons in an attempt to score before they can finish. It is frantic, mentally exhausting, and remarkably revealing of the people playing it: some gradually sharpen their arithmetic, some fall into intense flow states, and others become far more competitive than they were probably expecting. Watching those differences emerge became one of the most interesting parts of the project, particularly because the game’s simple back-and-forth structure leaves so much room for each pair of players to establish their own pace, tension, and relationship."
      },
      {
        title: "Back and Forth: Beat Pong",
        cover: "images/image26.jpg",
        video: "https://youtu.be/7gdgd_BQejA",
        link: "https://megamelone.itch.io/beat-pong",
        writeup:
        "The Back and Forth games anthology gave birth to an unholy fusion of genres in the shape of Beat Pong. This game was essentially designed entirely by long walks and longer showers, with painted images in my head paving the way for my design. The idea of the sound of a ping pong being the beat for a rhythm game, the image of a ping pong ball floating in an infinite rotation above the field of play, and the general neon feel to the game, essentially were the design equivalent of “it came to me in a dream” and the result honestly reflects that process. Beat Pong is weird, frantic, and if not for the aesthetic symbols synonymous with Ping Pong, has virtually no mechanical connection to the game the anthology is centered on exploring and deconstructing, and I believe that chaos is entirely to its benefit."
      },
      {
        title: "You Are Here.",
        cover: "images/image4.jpg",
        video: "https://youtu.be/NkVan1E9Cas",
        link: "https://megamelone.itch.io/you-are-here",
        writeup:
        "You Are Here is a wildly experimental project, which explores the subjectivity of perception, and the extent to which the reality presented by a game can temporarily become the player’s own. Players control a 2D character with a dancepad and a 3D character with a conventional controller, creating a deliberate mismatch between physical and digital dimensionality: the body is tied to the flatter, less realistic world, while the familiar language of game controls belongs to the space closest to our own. By demanding greater physical urgency and attention from the 2D character, the game asks whether our sense of presence is actually shaped by visual realism, or by where our body, effort, and immediate concern are situated. As both characters move simultaneously through their respective spaces, the player is left occupying two realities at once, with neither holding an entirely stable claim to being the more “real” one."
      },
      {
        title: "The Broken Computer",
        cover: "images/image39.jpg",
        video: "https://youtu.be/FWjPTtQWYHE",
        link: "https://megamelone.itch.io/letter-wars",
        writeup:
        "This is incredibly silly, and realistically should not be here, but is also a wonderful encapsulation of my process as a game designer. At Voidspace Live 2026, there was a non-functioning computer stuck in an infinite boot-loop, and instead of chucking it away, we created a miniature installation piece for it on the spot, tasking visitors of the exhibit to have a crack at trying to fix this computer, with an open forum on the side, so players can write their findings to help future players. People surprisingly resonated with the absurdity of this, and there was genuine cumulative progress being made as people left behind strings for their successors to pull at. It’s a beautiful reminder that play can come in any shape, and that play can take the form of something pure and selfless, a shared communal experience that brings people who may not even meet far closer together."
      },
      {
        title: "Letter Wars",
        cover: "images/image13.png",
        video: "https://youtu.be/ykMgiZ7Taok",
        link: "https://megamelone.itch.io/letter-wars",
        writeup:
        "Letter Wars is a brutally difficult 2D boss rush where every letter of the alphabet is given its own movement, personality, and lovingly excessive lore. The alphabet began as a practical solution to my complete lack of artistic ability, but quickly became a fascinating design constraint: how do you make over twenty universally recognisable symbols feel entirely distinct using the same movement and attack system? My answer involved three months of wild ambition, thirty separate scenes, almost no reusable code, and an amount of brute force that I remain strangely proud of. Its difficulty draws from the wonderfully hostile era of late-2000s online games, where progress was earned through repetition, stubbornness, and hundreds of deaths; an approach that will alienate plenty of people, but can also inspire the rare player to spend three uninterrupted hours refusing to let a single letter defeat them (this was a real thing that happened, where an 8 year old spent 3 uninterrupted hours beating the game to completion)."
      },
      {
        title: "RPS Ultra Adventure",
        cover: "images/image14.png",
        video: "https://youtu.be/TfSCAOQMqk4",
        link: "https://redsmiley.itch.io/rps-ultra-rpg",
        writeup:
        "RPS Ultra Adventure is a 1-bit surrealist comedy turn-based RPG made in a single week, built around the entirely reasonable premise that every person, monster, and eldritch horror settles their problems through Rock Paper Scissors. Players move between two versions of the same world: a relentlessly cheerful Light World filled with suspiciously friendly people, and a Dark World populated by abstract creatures, ominous drones, and equally ridiculous conversations. Beneath the surreal dialogue and very committed Rock Paper Scissors obsession is a strange little world that occasionally allows something sincere and philosophical to slip through, before immediately returning to nonsense. For a thirty-minute RPG held together by one week of frantic design, improvised file-sharing, and an unreasonable amount of personal investment, it remains one of the clearest expressions of my love for eccentric retro RPGs."
      },
      {
        title: "Don't Touch THE THNIG",
        cover: "images/image15.jpg",
        video: "https://youtu.be/--XJHvj2Vkg",
        link: "",
        writeup:
        "Built around the socially irresistible act of telling people they cannot touch something, Don’t Touch THE THING is a dexterity-based party game where players flick heart-shaped tokens around an ominous centerpiece, trying to force each other into skulls or THE THING, while their own defeated pieces can be returned to the board as hazards. The game emerged after roughly ten failed prototypes taught me to stop burying physical play beneath complicated systems, and instead trust the pleasure of flicking wooden objects at your friends. Its single prohibition applies even during setup and cleanup, giving THE THING a strange authority beyond the formal boundaries of play; people remain wary of it even when there is no strategic reason to be. Eliminated players tend to become invested spectators and enthusiastic backseat flickers, lending the game a loud, communal energy."
      },
      {
        title: "Gazing Endless Eye",
        cover: "images/image38.png",
        video: "https://youtu.be/8U3WYguIN28",
        link:
          "https://megamelone.itch.io/gazing-endless-eye",
        writeup:
        "Gazing Endless Eye was made in Flickgame for the Game Poem Wall at London Game Festival’s Play Praxis, and was based on the haiku: “Gazing Endless Eye / It Sees Mirrors In Your Mind / Shame, Fear, Grief, Rage, Joy.” It is about the exposing feeling of having other people experience my art, and the vulnerability of knowing that people are peering into something deeply personal. The process, the blood, the sweat, and the tears I put into a game are all there to be seen. Players click deeper and deeper into the eye, staring at it, confronting it, and gradually learning to accept that the gazing eye exists, because I am making art for those gazing eyes. They are endless. They learn from my work, they love it, they hate it, and sometimes they misunderstand it, but my art makes them feel something. I make games for those gazing endless eyes. As someone who is a minority in several different ways, those eyes can be difficult to look at, but they are still deeply important to me."
      },
      {
        title: "Marble Labyrinth",
        cover: "images/image16.jpg",
        video: "https://youtu.be/aktTPTkNCTQ",

    let currentIndex = 0;

    const titleEl =
      document.getElementById("gameTitle");

    const counterEl =
      document.getElementById("gameCounter");

    const coverEl =
      document.getElementById("gameCover");

    const videoEl =
      document.getElementById("gameVideo");

    const writeupEl =
      document.getElementById("gameWriteup");

    const progressEl =
      document.getElementById("gameProgress");

    const showcaseEl =
      document.getElementById("gameShowcase");

    function youtubeEmbedUrl(url) {
      if (!url) {
        return "";
      }

      try {
        const parsed = new URL(url);

        if (parsed.hostname.includes("youtu.be")) {
          const videoId =
            parsed.pathname.replace("/", "");

          return `https://www.youtube.com/embed/${videoId}`;
        }

        if (parsed.hostname.includes("youtube.com")) {
          const videoId =
            parsed.searchParams.get("v");

          if (videoId) {
            return `https://www.youtube.com/embed/${videoId}`;
          }

          if (parsed.pathname.includes("/embed/")) {
            return url;
          }

          if (parsed.pathname.includes("/shorts/")) {
            const shortId =
              parsed.pathname
                .split("/shorts/")[1]
                .split("/")[0];

            return `https://www.youtube.com/embed/${shortId}`;
          }
        }
      } catch (error) {
        console.warn("Invalid video URL:", url);
      }

      return url;
    }

    function renderGame(index) {
      const game = games[index];

      titleEl.textContent =
        game.title;

      counterEl.textContent =
        `${index + 1} / ${games.length}`;

      progressEl.style.width =
        `${((index + 1) / games.length) * 100}%`;

      coverEl.src =
        game.cover;

      coverEl.alt =
        `${game.title} cover image`;

      videoEl.src =
        youtubeEmbedUrl(game.video);

      videoEl.title =
        `${game.title} video`;

      writeupEl.textContent =
        game.writeup;

      showcaseEl.classList.toggle(
        "has-link",
        Boolean(game.link)
      );

      showcaseEl.setAttribute(
        "aria-label",
        game.link
          ? `Open ${game.title}`
          : `${game.title} has no external game page`
      );

      showcaseEl.setAttribute(
        "aria-disabled",
        game.link ? "false" : "true"
      );
    }

    function goToGame(direction) {
      currentIndex =
        (
          currentIndex +
          direction +
          games.length
        ) % games.length;

      renderGame(currentIndex);
    }

    function openCurrentGame() {
      const game = games[currentIndex];

      if (!game.link) {
        return;
      }

      window.open(
        game.link,
        "_blank",
        "noopener,noreferrer"
      );
    }

    document
      .getElementById("previousGame")
      .addEventListener(
        "click",
        () => goToGame(-1)
      );

    document
      .getElementById("nextGame")
      .addEventListener(
        "click",
        () => goToGame(1)
      );

    document
      .getElementById("previousGameMobile")
      .addEventListener(
        "click",
        () => goToGame(-1)
      );

    document
      .getElementById("nextGameMobile")
      .addEventListener(
        "click",
        () => goToGame(1)
      );

    showcaseEl.addEventListener(
      "click",
      (event) => {
        const interactiveElement =
          event.target.closest(
            "button, a, iframe"
          );

        if (interactiveElement) {
          return;
        }

        openCurrentGame();
      }
    );

    showcaseEl.addEventListener(
      "keydown",
      (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          openCurrentGame();
        }
      }
    );

    document.addEventListener(
      "keydown",
      (event) => {
        const key =
          event.key.toLowerCase();

        const activeTag =
          document.activeElement
            ?.tagName
            ?.toLowerCase();

        if (
          activeTag === "input" ||
          activeTag === "textarea" ||
          activeTag === "select"
        ) {
          return;
        }

        if (
          key === "arrowleft" ||
          key === "a"
        ) {
          event.preventDefault();
          goToGame(-1);
        }

        if (
          key === "arrowright" ||
          key === "d"
        ) {
          event.preventDefault();
          goToGame(1);
        }

        if (
          key === "enter" &&
          document.activeElement !== showcaseEl
        ) {
          event.preventDefault();
          openCurrentGame();
        }
      }
    );

    renderGame(currentIndex);
  </script>
</body>
</html>
